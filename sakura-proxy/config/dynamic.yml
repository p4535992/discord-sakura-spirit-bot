# Dynamic Traefik configuration, reloaded by the file provider.
# The bot has no public HTTP API: only the liveness probe is published. The
# readiness diagnostics (/ready) stay reachable only inside the Docker network,
# for example through `docker compose exec sakura-bot`.
http:
  routers:
    sakura-bot-health:
      entryPoints:
        - websecure
      rule: "Path(`/health`)"
      priority: 10
      service: sakura-bot
      tls: {}

  services:
    sakura-bot:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://sakura-bot:8080"
