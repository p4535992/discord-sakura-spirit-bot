# Dynamic Traefik configuration, reloaded by the file provider.
# The bot has no public HTTP API: Traefik only exposes its health endpoint so
# the container can be probed through the proxy.
http:
  routers:
    sakura-bot-health:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/`)"
      priority: 1
      service: sakura-bot
      tls: {}

  services:
    sakura-bot:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://sakura-bot:8080"
