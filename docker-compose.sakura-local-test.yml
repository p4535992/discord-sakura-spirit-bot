# Isolated local test stack for the existing Python test suite.
#
# It is independent from docker-compose.yml and docker-compose.test.yml: own
# project name, own internal network, own throwaway PostgreSQL, no host-published
# port, no shared volume. The bot itself is never started, so the fake
# credentials in .env.sakura-local-test cannot reach Discord or OpenAI. The cache
# is in-process, so the suite needs no Redis container.
#
#   docker compose --env-file .env.sakura-local-test -f docker-compose.sakura-local-test.yml config --quiet
#   docker compose --env-file .env.sakura-local-test -f docker-compose.sakura-local-test.yml up --build --abort-on-container-exit --exit-code-from sakura-test-runner sakura-test-runner
#   docker compose --env-file .env.sakura-local-test -f docker-compose.sakura-local-test.yml down
name: ${SAKURA_LOCAL_TEST_PROJECT_NAME:-sakura-spirit-bot-local-test}

services:
  sakura-postgres-test:
    # 16.15 is the version already present in the local image cache; override
    # SAKURA_POSTGRES_VERSION to test another release.
    image: "postgres:${SAKURA_POSTGRES_VERSION:-16.15}"
    restart: "no"
    mem_limit: ${SAKURA_TEST_POSTGRES_MEM_LIMIT:-256m}
    cpus: 0.5
    environment:
      TZ: Europe/Rome
      POSTGRES_DB: ${SAKURA_TEST_POSTGRES_DB:-sakura_test}
      POSTGRES_USER: ${SAKURA_TEST_POSTGRES_USER:-sakura_test}
      POSTGRES_PASSWORD: ${SAKURA_TEST_POSTGRES_PASSWORD:-sakura_local_test_pw}
    # No ports: the destructive test database is reachable only from the
    # internal test network.
    tmpfs:
      # Ephemeral storage: nothing survives `down` and no Docker volume is used.
      - /var/lib/postgresql/data
    volumes:
      # Creates the marker row that tests/support/database_guard.py requires
      # before it is allowed to drop the schema.
      - ./sakura-postgres/test-init:/docker-entrypoint-initdb.d:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sakura-local-test

  sakura-test-runner:
    build:
      context: ./sakura-bot
      dockerfile: Dockerfile.local-test
    image: sakura-spirit-bot-test-runner:local
    restart: "no"
    mem_limit: ${SAKURA_TEST_RUNNER_MEM_LIMIT:-1g}
    cpus: 1.0
    depends_on:
      sakura-postgres-test:
        condition: service_healthy
    environment:
      TZ: Europe/Rome
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Destructive target: the throwaway cluster of this stack only. The guard
      # in tests/support/database_guard.py accepts exactly this tuple.
      SAKURA_POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://${SAKURA_TEST_POSTGRES_USER:-sakura_test}:${SAKURA_TEST_POSTGRES_PASSWORD:-sakura_local_test_pw}@sakura-postgres-test:5432/${SAKURA_TEST_POSTGRES_DB:-sakura_test}
      # Application URL: tests/conftest.py replaces it with an unreachable
      # placeholder before importing any project module. It is kept distinct
      # from the test target so the guard can tell the two apart.
      SAKURA_BOT_DATABASE_URL: postgresql+asyncpg://sakura_local:${SAKURA_TEST_POSTGRES_PASSWORD:-sakura_local_test_pw}@sakura-postgres-test:5432/sakura_local
      # Fake credentials: they are never used for a real login.
      SAKURA_BOT_DISCORD_TOKEN: ${SAKURA_BOT_DISCORD_TOKEN:-local-test-fake-discord-token}
      SAKURA_BOT_DISCORD_CLIENT_ID: ${SAKURA_BOT_DISCORD_CLIENT_ID:-123456789012345678}
      SAKURA_BOT_OPENAI_API_KEY: ${SAKURA_BOT_OPENAI_API_KEY:-local-test-fake-openai-key}
      SAKURA_BOT_ENVIRONMENT: test
      SAKURA_BOT_LOG_LEVEL: WARNING
      SAKURA_BOT_HEALTH_SERVER_ENABLED: "false"
      SAKURA_BOT_STRICT_STARTUP: "false"
      # Root of the clone for the tests that assert the repository-level files
      # (Compose stacks, .env templates, .gitignore). Only those files are
      # mounted, so no local secret file is exposed to the container.
      SAKURA_REPOSITORY_ROOT: /repository
    volumes:
      # The tests always come from the clone under validation, read-only.
      # PYTHONDONTWRITEBYTECODE keeps pytest from writing bytecode there.
      - ./sakura-bot/tests:/app/tests:ro
      # Repository-level files asserted by
      # tests/unit/test_discord_beta_configuration.py.
      - ./docker-compose.discord-beta.yml:/repository/docker-compose.discord-beta.yml:ro
      - ./.env.discord-beta.example:/repository/.env.discord-beta.example:ro
      - ./.gitignore:/repository/.gitignore:ro
    working_dir: /app
    command: ["python", "-m", "pytest", "-v"]
    security_opt:
      - no-new-privileges:true
    networks:
      - sakura-local-test

networks:
  sakura-local-test:
    driver: bridge
    # No Internet access for the running containers: the dependencies are baked
    # into the image at build time.
    internal: true
