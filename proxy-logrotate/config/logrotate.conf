# Rotation for services that do not manage their own log files.
# copytruncate avoids restarts; it can lose a few bytes written during rotation.
/var/log/traefik/access.log /var/log/traefik/error.log
/var/log/sakura-bot/sakura_bot.log
/var/log/proxy-logrotate/crond.log /var/log/proxy-logrotate/rotate.log {
    size 50M
    rotate 10
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su root root
}
