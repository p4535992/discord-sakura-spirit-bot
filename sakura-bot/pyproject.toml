[tool.pytest.ini_options]
testpaths = ["tests"]
# Make ``pytest`` and ``python -m pytest`` behave the same: the application
# packages (core, commands, models, systems, utils) live next to this file.
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires a reachable PostgreSQL instance via SAKURA_POSTGRES_TEST_DATABASE_URL",
]

[tool.black]
line-length = 100
target-version = ["py313"]