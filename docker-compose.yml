# Local stack: Discord bot + PostgreSQL, with Traefik and a logrotate sidecar.
# Copy .env.example to .env, fill the secrets, then run:
#   docker compose up -d --build
name: sakura-spirit-bot

services:
  sakura-postgres:
    image: "postgres:${SAKURA_POSTGRES_VERSION}"
    container_name: sakura-postgres
    restart: always
    mem_limit: ${SAKURA_POSTGRES_MEM_LIMIT}
    cpus: 1.0
    environment:
      TZ: Europe/Rome
      # The official image only reads POSTGRES_*: .env keeps the container
      # prefix (SAKURA_POSTGRES_*) and Compose maps it here.
      POSTGRES_DB: ${SAKURA_POSTGRES_DB}
      POSTGRES_USER: ${SAKURA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SAKURA_POSTGRES_PASSWORD}
      # Keep the cluster in a subdirectory so the volume root stays clean.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Reachable only from the host loopback, never from the network.
      - "127.0.0.1:${SAKURA_POSTGRES_PORT}:5432"
    volumes:
      # Named volume: the cluster survives image rebuilds and `down`.
      - sakura-postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50M"
        max-file: "5"
    networks:
      - sakura-platform

  sakura-redis:
    # Required by core/cache.py for LFG sessions and cooldowns. Removing this
    # service requires SAKURA_BOT_CACHE_REQUIRED=false on the bot (degraded mode).
    image: "redis:${SAKURA_REDIS_VERSION}"
    container_name: sakura-redis
    restart: always
    mem_limit: ${SAKURA_REDIS_MEM_LIMIT}
    cpus: 0.25
    environment:
      TZ: Europe/Rome
    # Configuration lives in sakura-redis/config/redis.conf: no persistence, protected
    # mode disabled because the port is not published on the host.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./sakura-redis/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10M"
        max-file: "3"
    networks:
      - sakura-platform

  sakura-bot:
    image: sakura-spirit-bot:local
    build:
      # The container folder is the build context: it holds the application
      # sources, the requirements and its own .dockerignore.
      context: ./sakura-bot
      dockerfile: Dockerfile
    container_name: sakura-bot
    restart: always
    mem_limit: ${SAKURA_BOT_MEM_LIMIT}
    cpus: 1.0
    environment:
      TZ: Europe/Rome
      SAKURA_BOT_DISCORD_TOKEN: ${SAKURA_BOT_DISCORD_TOKEN}
      SAKURA_BOT_DISCORD_CLIENT_ID: ${SAKURA_BOT_DISCORD_CLIENT_ID}
      SAKURA_BOT_PREFIX: ${SAKURA_BOT_PREFIX}
      SAKURA_BOT_OWNER_ID: ${SAKURA_BOT_OWNER_ID}
      # Built from the PostgreSQL service variables above.
      SAKURA_BOT_DATABASE_URL: postgresql+asyncpg://${SAKURA_POSTGRES_USER}:${SAKURA_POSTGRES_PASSWORD}@sakura-postgres:5432/${SAKURA_POSTGRES_DB}
      SAKURA_BOT_REDIS_URL: redis://sakura-redis:6379/0
      SAKURA_BOT_CACHE_REQUIRED: "true"
      SAKURA_BOT_OPENAI_API_KEY: ${SAKURA_BOT_OPENAI_API_KEY}
      SAKURA_BOT_ENVIRONMENT: ${SAKURA_BOT_ENVIRONMENT}
      SAKURA_BOT_LOG_LEVEL: ${SAKURA_BOT_LOG_LEVEL}
      SAKURA_BOT_LOG_FILE: /var/log/sakura-bot/sakura_bot.log
      SAKURA_BOT_STRICT_STARTUP: "true"
      SAKURA_BOT_HEALTH_SERVER_ENABLED: "true"
      SAKURA_BOT_HEALTH_HOST: "0.0.0.0"
      SAKURA_BOT_HEALTH_PORT: "8080"
      SAKURA_BOT_ENABLE_SPIRITS: ${SAKURA_BOT_ENABLE_SPIRITS}
      SAKURA_BOT_ENABLE_WEATHER: ${SAKURA_BOT_ENABLE_WEATHER}
      SAKURA_BOT_ENABLE_SOCIAL: ${SAKURA_BOT_ENABLE_SOCIAL}
      SAKURA_BOT_ENABLE_GAMING: ${SAKURA_BOT_ENABLE_GAMING}
      SAKURA_BOT_ENABLE_WORLD: ${SAKURA_BOT_ENABLE_WORLD}
      SAKURA_BOT_ENABLE_GACHA: ${SAKURA_BOT_ENABLE_GACHA}
      SAKURA_BOT_ENABLE_EVENTS: ${SAKURA_BOT_ENABLE_EVENTS}
    volumes:
      # Named volume: the directory created in the image keeps UID 10001.
      - sakura-bot-logs:/var/log/sakura-bot
    security_opt:
      - no-new-privileges:true
    depends_on:
      sakura-postgres:
        condition: service_healthy
      sakura-redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50M"
        max-file: "5"
    networks:
      - sakura-platform

  sakura-proxy:
    image: "traefik:${SAKURA_PROXY_TRAEFIK_VERSION}"
    container_name: sakura-proxy
    restart: always
    mem_limit: ${SAKURA_PROXY_MEM_LIMIT}
    cpus: 0.5
    environment:
      TZ: Europe/Rome
    ports:
      # Loopback only: the local profile must not publish the endpoint on the
      # host network interfaces. Publish it on a specific address only after
      # deciding to expose it, with a real certificate and access control.
      - "127.0.0.1:${SAKURA_PROXY_HTTPS_PORT}:443"
    volumes:
      - sakura-proxy-logs:/var/log/traefik
      - ./sakura-proxy/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./sakura-proxy/config/dynamic.yml:/etc/traefik/dynamic.yml:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      sakura-bot:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "50M"
        max-file: "5"
    networks:
      - sakura-platform

  sakura-proxy-logrotate:
    image: sakura-spirit-bot/logrotate:local
    build:
      context: ./sakura-proxy-logrotate
    container_name: sakura-proxy-logrotate
    restart: always
    mem_limit: ${SAKURA_PROXY_LOGROTATE_MEM_LIMIT}
    cpus: 0.25
    environment:
      TZ: Europe/Rome
    volumes:
      - sakura-proxy-logrotate-state:/var/lib/logrotate
      - sakura-proxy-logrotate-logs:/var/log/sakura-proxy-logrotate
      # Shared with the bot and Traefik: the sidecar rotates their files in place.
      - sakura-bot-logs:/var/log/sakura-bot
      - sakura-proxy-logs:/var/log/traefik
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      sakura-proxy:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10M"
        max-file: "3"
    networks:
      - sakura-platform

volumes:
  # State that must survive image rebuilds and `docker compose down`.
  # Docker keeps it in its data root (relocatable to another disk through the
  # daemon configuration); `docker compose down -v` deletes it. Compose prefixes
  # the real names with the project name (`sakura-spirit-bot_<volume>`).
  sakura-postgres-data:
  sakura-bot-logs:
  sakura-proxy-logs:
  sakura-proxy-logrotate-state:
  sakura-proxy-logrotate-logs:

networks:
  sakura-platform:
    driver: bridge
