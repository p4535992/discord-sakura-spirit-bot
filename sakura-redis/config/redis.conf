# Redis for the Sakura Spirit Bot stack (container sakura-redis).
#
# Ephemeral cache only: LFG sessions and cooldowns, no persistence.
#
# The port is never published on the host, so the container listens on every
# interface of the compose network with protected mode disabled; the bot
# connects to redis://sakura-redis:6379/0.

bind 0.0.0.0
protected-mode no
port 6379

# No RDB snapshots and no AOF: the cache is rebuilt on restart.
save ""
appendonly no