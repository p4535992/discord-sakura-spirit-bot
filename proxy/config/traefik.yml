# Static Traefik configuration; changes require a restart.
# Only :443 is published on the host. The dashboard/ping entry point stays on
# the container loopback and is deliberately not exposed.
entryPoints:
  websecure:
    address: ":443"
  traefik:
    address: "127.0.0.1:8080"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

ping:
  entryPoint: traefik

# No default certificate is configured: Traefik generates a self-signed one for
# local development. Replace it with a real certificate before exposing the
# endpoint outside the workstation.
log:
  level: INFO
  filePath: /var/log/traefik/error.log
  format: common

accessLog:
  filePath: /var/log/traefik/access.log
  format: common
  addInternals: true
